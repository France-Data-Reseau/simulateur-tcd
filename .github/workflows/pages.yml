name: Déploiement GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Construire et tester
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '>=24.15.0 <25'
          cache: npm

      - name: Installer les dépendances Python
        run: python3 -m pip install -r requirements.txt

      - name: Installer les dépendances Node.js
        run: npm ci

      - name: Construire et exécuter les tests
        run: npm test

      - name: Préparer le site pour GitHub Pages
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: public/

  publish:
    name: Publier sur GitHub Pages
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: "github-pages"
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
